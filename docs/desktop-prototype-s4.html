<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniAPI Desktop · S4 Soft Product 原型</title>
  <style>
    :root {
      --bg-canvas: #fafbff;
      --bg-sidebar: #ffffff;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-accent-soft: #eef2ff;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-accent: #c7d2fe;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --success-border: #bbf7d0;
      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --warning-text: #c2410c;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --shadow-card: 0 18px 40px rgba(15, 23, 42, 0.05);
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.04);
      --radius-lg: 18px;
      --radius-xl: 22px;
      --font-sans: "Plus Jakarta Sans", Inter, "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background:
        radial-gradient(circle at 10% 0%, rgba(79,70,229,.10), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(6,182,212,.07), transparent 24%),
        #eef2ff;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .studio {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .studio-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .studio-head h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -.03em;
      font-weight: 800;
    }

    .studio-head p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 760px;
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-tab {
      border: 1px solid var(--border-subtle);
      background: rgba(255,255,255,.8);
      color: var(--text-secondary);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .mode-tab.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(79,70,229,.22);
    }

    .stage-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      align-items: start;
    }

    .window-frame {
      background: #0f172a;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, .22);
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #cbd5e1;
      font-size: 12px;
      padding: 4px 8px 10px;
    }

    .traffic { display: flex; gap: 6px; }
    .traffic i { width: 10px; height: 10px; border-radius: 50%; display: block; background: #475569; }
    .traffic i:nth-child(1) { background: #ff5f57; }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }

    .window-body {
      background: var(--bg-canvas);
      border-radius: 14px;
      min-height: 720px;
      overflow: hidden;
      position: relative;
    }

    /* ===== Shared UI ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: #fff;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13px;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 8px 20px rgba(79,70,229,.22);
    }
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-secondary { background: var(--bg-accent-soft); color: var(--accent); border-color: var(--border-accent); }
    .btn-ghost { background: #fff; }
    .btn-danger { background: var(--danger-soft); color: #b91c1c; border-color: rgba(239,68,68,.25); }
    .btn-sm { min-height: 32px; padding: 5px 10px; font-size: 12px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-success { background: var(--success-soft); color: #059669; }
    .badge-warning { background: var(--warning-soft); color: var(--warning-text); }
    .badge-muted { background: #f1f5f9; color: var(--text-secondary); }
    .badge-danger { background: var(--danger-soft); color: #b91c1c; }
    .badge-info { background: var(--bg-accent-soft); color: var(--accent); }

    .input, .select, .textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: #fff;
      color: var(--text-primary);
      padding: 10px 12px;
    }
    .textarea { min-height: 96px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      outline: 3px solid rgba(79,70,229,.16);
      border-color: var(--accent);
    }
    .field { display: grid; gap: 8px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--text-secondary); }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
    }

    /* ===== Wizard ===== */
    .wizard {
      min-height: 720px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px;
      background:
        radial-gradient(circle at 12% 0%, rgba(79,70,229,.08), transparent 30%),
        var(--bg-canvas);
    }
    .wizard-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center; color: #fff; font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #4f46e5 55%, #06b6d4);
      box-shadow: 0 12px 28px rgba(79,70,229,.28);
    }
    .steps-rail {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .steps-rail .dot {
      width: 28px; height: 6px; border-radius: 999px; background: #e2e8f0;
    }
    .steps-rail .dot.on { background: var(--accent); }
    .steps-rail .dot.done { background: #a5b4fc; }

    .wizard-main {
      display: grid;
      place-items: center;
    }
    .wizard-card {
      width: min(640px, 100%);
      padding: 28px;
    }
    .wizard-card h2 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -.03em;
      font-weight: 800;
    }
    .wizard-card p.lead {
      margin: 0 0 22px;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .wizard-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .channel-pick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pick {
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px;
      background: var(--bg-subtle);
      text-align: left;
      display: grid;
      gap: 6px;
    }
    .pick.active {
      background: var(--bg-accent-soft);
      border-color: var(--border-accent);
      box-shadow: 0 0 0 1px rgba(79,70,229,.08);
    }
    .pick strong { font-size: 14px; }
    .pick span { font-size: 12px; color: var(--text-secondary); }
    .snippet {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--bg-subtle);
      border: 1px dashed var(--border-strong);
      border-radius: 14px;
      padding: 14px;
      line-height: 1.7;
      color: var(--text-primary);
      overflow: auto;
    }

    /* ===== App shell ===== */
    .app {
      min-height: 720px;
      display: grid;
      grid-template-columns: 232px 1fr;
    }
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .nav { display: grid; gap: 6px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      color: var(--text-secondary);
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
    }
    .nav-item.active {
      background: var(--bg-accent-soft);
      color: var(--accent);
      border-color: var(--border-accent);
    }
    .sidebar-foot {
      margin-top: auto;
      padding: 12px;
      border-radius: 14px;
      background: linear-gradient(180deg, #eef2ff, #fff);
      border: 1px solid #e0e7ff;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: #fff;
      border-bottom: 1px solid var(--border-subtle);
    }
    .topbar h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.03em;
      font-weight: 800;
    }
    .topbar .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .view {
      padding: 16px 18px 20px;
      display: grid;
      gap: 14px;
      align-content: start;
      overflow: auto;
      max-height: 652px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
    }
    .service-card, .steps-card, .panel {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 18px;
    }
    .service-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .service-head .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .status-word { font-size: 28px; font-weight: 800; letter-spacing: -.04em; }
    .status-word.ok { color: #059669; }
    .status-word.warn { color: var(--warning-text); }
    .status-word.bad { color: var(--danger); }

    .toggle {
      width: 64px; height: 36px; border: 0; border-radius: 999px;
      background: var(--accent); position: relative;
      box-shadow: 0 8px 18px rgba(79,70,229,.25);
    }
    .toggle::after {
      content: ""; position: absolute; top: 4px; right: 4px;
      width: 28px; height: 28px; border-radius: 50%; background: #fff;
      box-shadow: 0 2px 8px rgba(15,23,42,.15);
    }
    .toggle.off { background: #cbd5e1; box-shadow: none; }
    .toggle.off::after { right: auto; left: 4px; }

    .endpoint {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 16px;
      background: var(--bg-subtle); border: 1px dashed var(--border-strong);
      margin-bottom: 12px;
    }
    .endpoint code {
      flex: 1; font-family: var(--font-mono); font-size: 13px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .step-list { display: grid; gap: 10px; }
    .step {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 12px 14px; border-radius: 14px;
      background: var(--bg-subtle); border: 1px solid var(--border-subtle);
      font-size: 13px;
    }
    .step .n {
      width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center;
      background: #e2e8f0; color: var(--text-secondary); font-size: 12px; font-weight: 700; flex: 0 0 auto;
    }
    .step.done { background: var(--success-soft); border-color: var(--success-border); }
    .step.done .n { background: var(--success); color: #fff; }
    .step.current { background: var(--bg-accent-soft); border-color: var(--border-accent); color: #4338ca; }
    .step.current .n { background: var(--accent); color: #fff; }
    .step small { display: block; margin-top: 4px; color: var(--text-secondary); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    .metric {
      background: #fff; border: 1px solid var(--border-subtle); border-radius: 16px;
      box-shadow: var(--shadow-soft); padding: 14px; min-height: 100px;
    }
    .metric span { display: block; font-size: 12px; color: var(--text-secondary); font-weight: 700; margin-bottom: 8px; }
    .metric strong { display: block; font-size: 26px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .metric small { display: block; margin-top: 8px; color: var(--text-secondary); font-size: 12px; }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    .channel-card {
      border-radius: 16px; padding: 14px; border: 1px solid var(--border-subtle); background: var(--bg-subtle);
      min-height: 120px;
    }
    .channel-card.healthy { background: #f0fdf4; border-color: var(--success-border); }
    .channel-card.degraded { background: var(--warning-soft); border-color: #fde68a; }
    .channel-card h3 { margin: 0 0 8px; font-size: 14px; }
    .channel-card .meta { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; }
    .channel-card.healthy .meta { color: #16794a; }
    .channel-card.degraded .meta { color: var(--warning-text); }

    .panel-h {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .panel-h h3 { margin: 0; font-size: 15px; }
    .panel-h span { color: var(--text-muted); font-size: 12px; }

    .two-col {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 14px;
    }

    .chart-fake {
      height: 180px; border-radius: 14px; border: 1px solid var(--border-subtle);
      background:
        linear-gradient(180deg, rgba(79,70,229,.08), transparent),
        #fff;
      position: relative;
      overflow: hidden;
    }
    .chart-fake svg { width: 100%; height: 100%; display: block; }

    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th, .table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border-subtle); }
    .table th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    .table td { color: var(--text-secondary); }

    .log-line {
      font-family: var(--font-mono); font-size: 12px; padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary);
      display: grid; grid-template-columns: 72px 56px 1fr; gap: 10px;
    }
    .log-line .err { color: var(--danger); font-weight: 700; }
    .log-line .warn { color: var(--warning-text); font-weight: 700; }
    .log-line .info { color: var(--accent); font-weight: 700; }

    .settings-sections { display: grid; gap: 14px; }
    .settings-sections .panel h3 { margin: 0 0 12px; font-size: 15px; }
    .settings-grid { display: grid; gap: 12px; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border-subtle); font-size: 13px;
    }
    .switch-row:last-child { border-bottom: 0; }

    /* ===== Tray ===== */
    .tray-scene {
      min-height: 720px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, #dbe4ff, #eef2ff 40%, #f8fafc);
      position: relative;
      overflow: hidden;
    }
    .desktop-fake {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .35;
    }
    .tray-taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
      background: rgba(15,23,42,.82); color: #e2e8f0;
      display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 16px;
      font-size: 12px;
    }
    .tray-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px;
      position: relative; border: 0;
    }
    .tray-icon .dot {
      position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%;
      background: var(--success); border: 2px solid #0f172a;
    }
    .tray-icon.warn .dot { background: var(--warning); }
    .tray-icon.bad .dot { background: var(--danger); }

    .tray-pop {
      width: 360px;
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(15,23,42,.18);
      padding: 14px;
      position: relative;
      z-index: 2;
      margin-bottom: 80px;
    }
    .tray-pop h3 { margin: 0 0 4px; font-size: 16px; }
    .tray-pop .sub { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; }
    .tray-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .tray-stats div {
      background: var(--bg-subtle); border-radius: 12px; padding: 10px; text-align: center;
    }
    .tray-stats strong { display: block; font-size: 16px; margin-top: 4px; }
    .tray-stats span { font-size: 11px; color: var(--text-secondary); }
    .tray-channels { display: grid; gap: 8px; margin-bottom: 12px; }
    .tray-channels .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; padding: 8px 10px; border-radius: 12px; background: var(--bg-subtle);
    }
    .tray-actions { display: grid; gap: 8px; }

    /* ===== Inspector ===== */
    .side-doc {
      background: rgba(255,255,255,.86);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      padding: 16px;
      position: sticky;
      top: 16px;
    }
    .side-doc h3 { margin: 0 0 8px; font-size: 15px; }
    .side-doc p, .side-doc li {
      color: var(--text-secondary); font-size: 13px; line-height: 1.6;
    }
    .side-doc ul { margin: 0; padding-left: 18px; }
    .side-doc .flow {
      display: grid; gap: 8px; margin: 12px 0;
    }
    .side-doc .flow div {
      padding: 10px 12px; border-radius: 12px; background: var(--bg-accent-soft);
      color: #4338ca; font-size: 12px; font-weight: 700;
    }
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 50;
      background: #fff; border: 1px solid var(--border-subtle); border-radius: 12px;
      box-shadow: var(--shadow-card); padding: 12px 14px; font-size: 13px;
      display: none;
    }
    .toast.show { display: block; }

    @media (max-width: 1100px) {
      .stage-grid, .hero-grid, .two-col, .metrics, .channel-grid, .channel-pick, .app {
        grid-template-columns: 1fr;
      }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--border-subtle); }
      .app { min-height: auto; }
      .view { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <div class="studio-head">
      <div>
        <h1>OmniAPI Desktop · S4 完整原型</h1>
        <p>
          按推荐方案 <strong>A（托盘控制台）+ C（首启向导）</strong> 设计，视觉采用已锁定的 Soft Product。
          可切换：首启向导 · 主窗口 · 托盘弹层。这是可点击的产品原型，便于评审与开发对齐。
        </p>
      </div>
      <div class="pill">设计锁定 · 非生产代码 · 可截图评审</div>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="wizard">1. 首启向导</button>
      <button class="mode-tab" data-mode="app">2. 主窗口</button>
      <button class="mode-tab" data-mode="tray">3. 托盘弹层</button>
    </div>

    <div class="stage-grid">
      <div class="window-frame">
        <div class="titlebar">
          <div class="traffic"><i></i><i></i><i></i></div>
          <div id="windowTitle">OmniAPI Setup</div>
          <div>S4 Soft Product</div>
        </div>
        <div class="window-body" id="stage"></div>
      </div>

      <aside class="side-doc" id="sideDoc"></aside>
    </div>
  </div>

  <div class="toast" id="toast">已复制</div>

  <script>
    const state = {
      mode: 'wizard',
      wizardStep: 0,
      selectedChannels: new Set(['deepseek', 'qwen']),
      credMode: 'token',
      tokenValue: '',
      tested: false,
      gatewayOn: true,
      health: 'healthy', // healthy | degraded | unavailable
      route: 'home',
      copied: false,
    };

    const CHANNELS = [
      { id: 'deepseek', name: 'DeepSeek', status: 'healthy', avail: 8, total: 10, caps: ['文本', '思考'] },
      { id: 'qwen', name: 'Qwen', status: 'degraded', avail: 4, total: 6, caps: ['文本', '搜索', '图像'] },
      { id: 'kimi', name: 'Kimi', status: 'healthy', avail: 3, total: 4, caps: ['文本', '长上下文'] },
      { id: 'glm', name: 'GLM', status: 'unconfigured', avail: 0, total: 0, caps: ['文本'] },
    ];

    const DOCS = {
      wizard: {
        title: '首启向导',
        body: `
          <p>目标：5 分钟内完成「能调用」。</p>
          <div class="flow">
            <div>欢迎 → 选渠道 → 填凭据 → 测通 → 复制地址</div>
          </div>
          <ul>
            <li>只暴露必要字段</li>
            <li>允许跳过直接进入主窗</li>
            <li>完成后默认落首页</li>
          </ul>
        `,
      },
      app: {
        title: '主窗口 IA',
        body: `
          <p>一级导航控制在 6 项以内。</p>
          <ul>
            <li><b>首页</b>：开关态 + Endpoint + 引导</li>
            <li><b>渠道 / 凭据</b>：配置</li>
            <li><b>监控 / 日志</b>：次级运维</li>
            <li><b>设置</b>：自启、通知、高级开关</li>
          </ul>
          <p>关窗 = 回托盘，不杀网关。</p>
        `,
      },
      tray: {
        title: '托盘弹层',
        body: `
          <p>日常挂机只靠托盘。</p>
          <ul>
            <li>状态点：绿/黄/红</li>
            <li>复制地址、打开面板、重启</li>
            <li>退出需二次确认（文案层）</li>
          </ul>
        `,
      },
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }

    function endpoint() {
      return 'http://127.0.0.1:3000/v1';
    }

    function healthWord() {
      if (!state.gatewayOn || state.health === 'unavailable') return { text: '已停止', cls: 'bad' };
      if (state.health === 'degraded') return { text: '需关注', cls: 'warn' };
      return { text: '运行中', cls: 'ok' };
    }

    function renderSide() {
      const doc = DOCS[state.mode];
      document.getElementById('sideDoc').innerHTML = `<h3>${doc.title}</h3>${doc.body}
        <hr style="border:none;border-top:1px solid var(--border-subtle);margin:14px 0;">
        <p><b>视觉：</b> S4 Soft Product<br><b>主色：</b> #4F46E5<br><b>文档：</b> desktop-product-design-s4.md</p>`;
    }

    function renderWizard() {
      document.getElementById('windowTitle').textContent = 'OmniAPI Setup';
      const step = state.wizardStep;
      const dots = Array.from({ length: 5 }, (_, i) =>
        `<div class="dot ${i === step ? 'on' : i < step ? 'done' : ''}"></div>`
      ).join('');

      let body = '';
      if (step === 0) {
        body = `
          <div class="wizard-card card">
            <div class="badge badge-info" style="margin-bottom:12px">欢迎</div>
            <h2>把网页模型变成本地 API</h2>
            <p class="lead">OmniAPI 会在本机启动兼容 OpenAI / Claude 的网关。完成三步后，即可把地址粘贴到 Cursor 或其他客户端。</p>
            <div class="channel-pick" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:8px">
              <div class="pick"><strong>1</strong><span>选择渠道并添加凭据</span></div>
              <div class="pick"><strong>2</strong><span>一键测通模型</span></div>
              <div class="pick"><strong>3</strong><span>复制本地 API 地址</span></div>
            </div>
            <div class="wizard-actions">
              <button class="btn btn-ghost" data-act="skip-wizard">我已有配置，直接进入</button>
              <button class="btn btn-primary" data-act="wiz-next">开始设置</button>
            </div>
          </div>`;
      } else if (step === 1) {
        body = `
          <div class="wizard-card card">
            <div class="badge badge-info" style="margin-bottom:12px">步骤 1 / 4</div>
            <h2>选择要启用的渠道</h2>
            <p class="lead">可多选。稍后只为选中的渠道配置凭据。未选渠道以后也能在主窗口添加。</p>
            <div class="channel-pick">
              ${['deepseek','qwen','kimi','glm'].map(id => {
                const c = CHANNELS.find(x => x.id === id);
                const on = state.selectedChannels.has(id);
                return `<button class="pick ${on ? 'active' : ''}" data-act="toggle-ch" data-id="${id}">
                  <strong>${c.name}</strong>
                  <span>${on ? '已选择' : '点击选择'}</span>
                </button>`;
              }).join('')}
            </div>
            <div class="wizard-actions">
              <button class="btn btn-ghost" data-act="wiz-prev">上一步</button>
              <button class="btn btn-primary" data-act="wiz-next" ${state.selectedChannels.size ? '' : 'disabled'}>继续</button>
            </div>
          </div>`;
      } else if (step === 2) {
        const first = [...state.selectedChannels][0] || 'deepseek';
        const name = CHANNELS.find(c => c.id === first)?.name || first;
        body = `
          <div class="wizard-card card">
            <div class="badge badge-info" style="margin-bottom:12px">步骤 2 / 4 · ${name}</div>
            <h2>添加上游凭据</h2>
            <p class="lead">Token 优先。部分渠道支持账密登录换票。保存后仅显示前缀。</p>
            <div style="display:flex;gap:8px;margin-bottom:12px">
              <button class="btn btn-sm ${state.credMode==='token'?'btn-secondary':''}" data-act="cred-mode" data-mode="token">Token</button>
              <button class="btn btn-sm ${state.credMode==='account'?'btn-secondary':''}" data-act="cred-mode" data-mode="account">账密</button>
            </div>
            ${state.credMode === 'token' ? `
              <div class="field">
                <label>Bearer Token</label>
                <input class="input" id="tokenInput" placeholder="sk-... 或渠道提供的 token" value="${state.tokenValue.replace(/"/g,'&quot;')}" />
              </div>` : `
              <div class="field" style="margin-bottom:10px"><label>邮箱</label><input class="input" placeholder="name@example.com" /></div>
              <div class="field"><label>密码</label><input class="input" type="password" placeholder="••••••••" /></div>
            `}
            <div class="wizard-actions">
              <button class="btn btn-ghost" data-act="wiz-prev">上一步</button>
              <button class="btn btn-primary" data-act="save-cred">保存并继续</button>
            </div>
          </div>`;
      } else if (step === 3) {
        body = `
          <div class="wizard-card card">
            <div class="badge badge-info" style="margin-bottom:12px">步骤 3 / 4</div>
            <h2>测通模型</h2>
            <p class="lead">向已配置渠道发送一条最短请求，确认鉴权与上游可用。</p>
            <div class="panel" style="box-shadow:none;margin-bottom:12px">
              <div class="panel-h"><h3>测试结果</h3><span>${state.tested ? '完成' : '待测'}</span></div>
              ${state.tested
                ? `<div class="badge badge-success">成功 · 842ms · qwen3.7-plus</div><p style="margin:10px 0 0;color:var(--text-secondary);font-size:13px">上游响应正常，可以进入接入步骤。</p>`
                : `<p style="margin:0;color:var(--text-secondary);font-size:13px">点击下方按钮开始测试。失败时可返回修改凭据。</p>`}
            </div>
            <div class="wizard-actions">
              <button class="btn btn-ghost" data-act="wiz-prev">上一步</button>
              <div style="display:flex;gap:8px">
                <button class="btn btn-secondary" data-act="run-test">${state.tested ? '重新测试' : '开始测试'}</button>
                <button class="btn btn-primary" data-act="wiz-next" ${state.tested ? '' : 'disabled'}>继续</button>
              </div>
            </div>
          </div>`;
      } else {
        body = `
          <div class="wizard-card card">
            <div class="badge badge-success" style="margin-bottom:12px">完成</div>
            <h2>可以接入客户端了</h2>
            <p class="lead">把下面的 Base URL 粘贴到 Cursor / 任意 OpenAI 兼容客户端。API Key 使用你在控制台配置的密钥。</p>
            <div class="endpoint">
              <code>${endpoint()}</code>
              <button class="btn btn-primary btn-sm" data-act="copy-endpoint">复制</button>
            </div>
            <div class="snippet">
# Cursor / OpenAI compatible<br>
OPENAI_BASE_URL=${endpoint()}<br>
OPENAI_API_KEY=sk-your-local-key<br><br>
curl ${endpoint()}/chat/completions \\<br>
&nbsp;&nbsp;-H "Authorization: Bearer sk-your-local-key" \\<br>
&nbsp;&nbsp;-d '{"model":"qwen3.7-plus","messages":[{"role":"user","content":"hi"}]}'
            </div>
            <div class="wizard-actions">
              <button class="btn btn-ghost" data-act="wiz-prev">上一步</button>
              <button class="btn btn-primary" data-act="finish-wizard">进入控制台</button>
            </div>
          </div>`;
      }

      return `
        <div class="wizard">
          <div class="wizard-top">
            <div class="brand"><div class="brand-mark">O</div>OmniAPI</div>
            <div class="steps-rail">${dots}</div>
          </div>
          <div class="wizard-main">${body}</div>
          <div style="color:var(--text-muted);font-size:12px;text-align:center">关窗不会中断已启动的网关 · 随时可从托盘打开</div>
        </div>`;
    }

    function renderHome() {
      const h = healthWord();
      const healthy = CHANNELS.filter(c => c.status === 'healthy').length;
      const degraded = CHANNELS.filter(c => c.status === 'degraded').length;
      const hasCreds = CHANNELS.some(c => c.total > 0);
      const steps = [
        { title: '添加渠道凭据', detail: hasCreds ? '已配置上游账号' : '去凭据页添加 Token', state: hasCreds ? 'done' : 'current' },
        { title: '确认渠道健康', detail: healthy ? '至少一条渠道可用' : '等待检查或执行测试', state: healthy ? 'done' : (hasCreds ? 'current' : '') },
        { title: '复制 API 地址到客户端', detail: 'Cursor / OpenAI 兼容客户端', state: healthy ? 'current' : '' },
      ];
      return `
        <div class="hero-grid">
          <section class="service-card">
            <div class="service-head">
              <div>
                <div class="label">服务状态</div>
                <div class="status-word ${h.cls}">${h.text}</div>
              </div>
              <button class="toggle ${state.gatewayOn ? '' : 'off'}" data-act="toggle-gateway" title="启停本地网关"></button>
            </div>
            <div class="endpoint">
              <code>${endpoint()}</code>
              <button class="btn btn-primary btn-sm" data-act="copy-endpoint">复制 API 地址</button>
            </div>
            <div class="chips">
              <span class="badge badge-success">${healthy} 渠道健康</span>
              <span class="badge badge-warning">${degraded} 渠道降级</span>
              <span class="badge badge-muted">队列 2/100</span>
            </div>
          </section>
          <section class="steps-card">
            <div class="panel-h"><h3>开始使用</h3><span>${steps.filter(s=>s.state==='done').length}/3 完成</span></div>
            <div class="step-list">
              ${steps.map((s,i)=>`
                <div class="step ${s.state}">
                  <div class="n">${s.state==='done'?'✓':i+1}</div>
                  <div><strong>${s.title}</strong><small>${s.detail}</small></div>
                </div>`).join('')}
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <button class="btn btn-secondary btn-sm" data-act="nav" data-route="credentials">添加凭据</button>
              <button class="btn btn-ghost btn-sm" data-act="nav" data-route="channels">查看渠道</button>
              <button class="btn btn-ghost btn-sm" data-act="nav" data-route="monitor">打开监控</button>
            </div>
          </section>
        </div>

        <div class="metrics">
          <div class="metric"><span>今日请求</span><strong>1.2k</strong><small>最近 5 分钟 42</small></div>
          <div class="metric"><span>成功率</span><strong>98.6%</strong><small>1,284 成功</small></div>
          <div class="metric"><span>平均延迟</span><strong>240ms</strong><small>P50 首包</small></div>
          <div class="metric"><span>可用账号</span><strong>15</strong><small>${healthy} 个健康渠道</small></div>
        </div>

        <section class="panel">
          <div class="panel-h"><h3>渠道概览</h3><span>${CHANNELS.length} 个渠道</span></div>
          <div class="channel-grid">
            ${CHANNELS.map(c => `
              <article class="channel-card ${c.status === 'healthy' ? 'healthy' : c.status === 'degraded' ? 'degraded' : ''}">
                <h3>${c.name}</h3>
                <div class="meta">${c.status === 'unconfigured' ? '未配置 · 去添加凭据' : `${c.status === 'healthy' ? '健康' : '降级'} · ${c.avail}/${c.total} 凭据`}</div>
                <span class="badge ${c.status==='healthy'?'badge-success':c.status==='degraded'?'badge-warning':'badge-muted'}">${c.status==='healthy'?'健康':c.status==='degraded'?'降级':'未配置'}</span>
              </article>
            `).join('')}
          </div>
        </section>

        <div class="two-col">
          <section class="panel">
            <div class="panel-h"><h3>请求趋势</h3><span>轻量预览</span></div>
            <div class="chart-fake">
              <svg viewBox="0 0 600 180" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0%" stop-color="#4f46e5" stop-opacity=".28"/>
                    <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path d="M0,130 C70,120 110,90 170,100 C240,112 280,70 340,80 C400,90 450,50 520,60 C560,66 580,48 600,52 L600,180 L0,180 Z" fill="url(#g)"/>
                <path d="M0,130 C70,120 110,90 170,100 C240,112 280,70 340,80 C400,90 450,50 520,60 C560,66 580,48 600,52" fill="none" stroke="#4f46e5" stroke-width="3"/>
              </svg>
            </div>
          </section>
          <section class="panel">
            <div class="panel-h"><h3>快速操作</h3><span>常用</span></div>
            <div class="step-list">
              <div class="step"><div class="n">→</div><div><strong>复制 OpenAI 兼容地址</strong><small>${endpoint()}</small></div></div>
              <div class="step"><div class="n">→</div><div><strong>管理上游凭据</strong><small>Token / 账密</small></div></div>
              <div class="step"><div class="n">→</div><div><strong>查看性能与日志</strong><small>延迟、RPM、错误</small></div></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <button class="btn btn-primary btn-sm" data-act="copy-endpoint">复制 Endpoint</button>
              <button class="btn btn-secondary btn-sm" data-act="nav" data-route="credentials">凭据</button>
              <button class="btn btn-ghost btn-sm" data-act="nav" data-route="logs">日志</button>
            </div>
          </section>
        </div>`;
    }

    function renderChannels() {
      return `
        <section class="panel">
          <div class="panel-h"><h3>渠道</h3><span>点击卡片管理凭据或测通</span></div>
          <div class="channel-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            ${CHANNELS.map(c => `
              <article class="channel-card ${c.status==='healthy'?'healthy':c.status==='degraded'?'degraded':''}" style="min-height:150px">
                <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
                  <h3 style="font-size:16px">${c.name}</h3>
                  <span class="badge ${c.status==='healthy'?'badge-success':c.status==='degraded'?'badge-warning':'badge-muted'}">${c.status==='healthy'?'健康':c.status==='degraded'?'降级':'未配置'}</span>
                </div>
                <div class="meta" style="margin:10px 0">${c.avail}/${c.total} 凭据可用</div>
                <div class="chips" style="margin-bottom:12px">${c.caps.map(x=>`<span class="badge badge-info">${x}</span>`).join('')}</div>
                <div style="display:flex;gap:8px">
                  <button class="btn btn-secondary btn-sm" data-act="nav" data-route="credentials">管理凭据</button>
                  <button class="btn btn-ghost btn-sm" data-act="toast" data-msg="已发送测试请求（原型）">测试</button>
                </div>
              </article>
            `).join('')}
          </div>
        </section>`;
    }

    function renderCredentials() {
      return `
        <div class="two-col">
          <section class="panel">
            <div class="panel-h"><h3>渠道</h3><span>选择后管理</span></div>
            <div class="step-list">
              ${CHANNELS.map((c,i)=>`
                <button class="step ${i===0?'current':''}" style="width:100%;text-align:left" data-act="toast" data-msg="原型：切换到 ${c.name}">
                  <div class="n">${i+1}</div>
                  <div><strong>${c.name}</strong><small>${c.avail}/${c.total} 凭据</small></div>
                </button>
              `).join('')}
            </div>
          </section>
          <section class="panel">
            <div class="panel-h"><h3>DeepSeek 凭据</h3><button class="btn btn-primary btn-sm" data-act="toast" data-msg="原型：打开添加表单">添加</button></div>
            <table class="table">
              <thead><tr><th>标识</th><th>类型</th><th>状态</th><th></th></tr></thead>
              <tbody>
                <tr><td>sk-12ab…9f</td><td>Token</td><td><span class="badge badge-success">可用</span></td><td><button class="btn btn-ghost btn-sm">删除</button></td></tr>
                <tr><td>user@mail.com</td><td>账号</td><td><span class="badge badge-warning">冷却</span></td><td><button class="btn btn-ghost btn-sm">删除</button></td></tr>
                <tr><td colspan="4" style="color:var(--text-muted)">保存后仅显示前缀；完整密钥进入系统钥匙串/加密存储（桌面实现）</td></tr>
              </tbody>
            </table>
          </section>
        </div>`;
    }

    function renderMonitor() {
      return `
        <div class="metrics">
          <div class="metric"><span>RPM</span><strong>42</strong><small>请求/分</small></div>
          <div class="metric"><span>P50</span><strong>240ms</strong><small>首包</small></div>
          <div class="metric"><span>Token/s</span><strong>18</strong><small>吞吐</small></div>
          <div class="metric"><span>错误率</span><strong>1.4%</strong><small>近窗</small></div>
        </div>
        <div class="two-col">
          <section class="panel"><div class="panel-h"><h3>RPM</h3><span>6h</span></div><div class="chart-fake"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><path d="M0,120 C100,110 150,80 250,90 C350,100 420,60 600,70" fill="none" stroke="#4f46e5" stroke-width="3"/></svg></div></section>
          <section class="panel"><div class="panel-h"><h3>延迟</h3><span>P50 / P90</span></div><div class="chart-fake"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><path d="M0,100 C120,90 200,110 300,70 C400,40 500,80 600,60" fill="none" stroke="#10b981" stroke-width="3"/><path d="M0,130 C120,125 200,140 300,110 C400,90 500,120 600,100" fill="none" stroke="#f59e0b" stroke-width="2"/></svg></div></section>
        </div>
        <section class="panel"><div class="panel-h"><h3>说明</h3></div><p style="margin:0;color:var(--text-secondary);font-size:13px;line-height:1.6">监控是次级页面。日常使用看首页即可；排障再来看延迟与错误率。高密度矩阵/热力不作为默认首页模块。</p></section>`;
    }

    function renderLogs() {
      const rows = [
        ['12:04:01','INFO','chat.completions model=qwen3.7-plus 200 842ms'],
        ['12:04:03','WARN','qwen token#2 cooldown 28s remaining'],
        ['12:04:05','INFO','deepseek stream ttfb=236ms tokens=18.4/s'],
        ['12:04:07','ERROR','queue wait timeout 30000ms'],
        ['12:04:08','INFO','kimi-k2.6-thinking 200 1.42s'],
      ];
      return `
        <section class="panel">
          <div class="panel-h">
            <h3>实时日志</h3>
            <div style="display:flex;gap:8px">
              <select class="select" style="width:120px;min-height:32px"><option>全部渠道</option></select>
              <button class="btn btn-ghost btn-sm">刷新</button>
            </div>
          </div>
          ${rows.map(([t,l,m]) => `
            <div class="log-line">
              <span>${t}</span>
              <span class="${l==='ERROR'?'err':l==='WARN'?'warn':'info'}">${l}</span>
              <span>${m}</span>
            </div>`).join('')}
        </section>`;
    }

    function renderSettings() {
      return `
        <div class="settings-sections">
          <section class="panel">
            <h3>通用</h3>
            <div class="switch-row"><span>开机自动启动</span><button class="toggle" data-act="toast" data-msg="原型开关"></button></div>
            <div class="switch-row"><span>关闭主窗口时保持托盘运行</span><button class="toggle" data-act="toast" data-msg="默认开启"></button></div>
            <div class="switch-row"><span>系统通知（渠道降级 / 队列满）</span><button class="toggle" data-act="toast" data-msg="默认开启"></button></div>
          </section>
          <section class="panel">
            <h3>接入</h3>
            <div class="endpoint"><code>${endpoint()}</code><button class="btn btn-primary btn-sm" data-act="copy-endpoint">复制</button></div>
            <p style="margin:0;color:var(--text-secondary);font-size:13px">桌面默认监听 127.0.0.1。修改端口属于启动参数，需重启核心进程。</p>
          </section>
          <section class="panel">
            <h3>访问密钥</h3>
            <table class="table">
              <thead><tr><th>名称</th><th>前缀</th><th></th></tr></thead>
              <tbody>
                <tr><td>default</td><td>sk-omni…a1</td><td><button class="btn btn-ghost btn-sm">撤销</button></td></tr>
              </tbody>
            </table>
            <button class="btn btn-secondary btn-sm" style="margin-top:10px" data-act="toast" data-msg="原型：创建 API Key">新建 API Key</button>
          </section>
          <section class="panel">
            <h3>高级</h3>
            <div class="switch-row"><span>Prompt Injection 兼容层</span><button class="toggle" data-act="toast" data-msg="映射 runtime.enable..."></button></div>
            <div class="switch-row"><span>会话亲和</span><button class="toggle off" data-act="toast" data-msg="conversation affinity"></button></div>
          </section>
        </div>`;
    }

    function renderApp() {
      document.getElementById('windowTitle').textContent = 'OmniAPI';
      const routes = {
        home: { eye: 'Home', title: '首页', view: renderHome },
        channels: { eye: 'Channels', title: '渠道', view: renderChannels },
        credentials: { eye: 'Credentials', title: '凭据', view: renderCredentials },
        monitor: { eye: 'Monitor', title: '监控', view: renderMonitor },
        logs: { eye: 'Logs', title: '日志', view: renderLogs },
        settings: { eye: 'Settings', title: '设置', view: renderSettings },
      };
      const r = routes[state.route] || routes.home;
      const nav = [
        ['home','首页'],['channels','渠道'],['credentials','凭据'],
        ['monitor','监控'],['logs','日志'],['settings','设置']
      ];
      return `
        <div class="app">
          <aside class="sidebar">
            <div class="brand"><div class="brand-mark">O</div><div><div>OmniAPI</div><div style="font-size:11px;color:var(--text-muted);font-weight:600">本地 AI 网关</div></div></div>
            <nav class="nav">
              ${nav.map(([id,label]) => `
                <button class="nav-item ${state.route===id?'active':''}" data-act="nav" data-route="${id}">${label}</button>
              `).join('')}
            </nav>
            <div class="sidebar-foot">
              <div style="color:#4f46e5;font-weight:800;margin-bottom:6px">${healthWord().text}</div>
              关窗后继续在托盘运行。<br/>退出请从托盘选择「退出」。
            </div>
          </aside>
          <section class="main">
            <header class="topbar">
              <div>
                <p class="eyebrow">${r.eye}</p>
                <h2>${r.title}</h2>
              </div>
              <div style="display:flex;gap:8px;align-items:center">
                <span class="badge ${state.gatewayOn ? (state.health==='degraded'?'badge-warning':'badge-success') : 'badge-danger'}">${healthWord().text}</span>
                <button class="btn btn-ghost btn-sm" data-act="mode" data-mode="tray">查看托盘</button>
              </div>
            </header>
            <div class="view">${r.view()}</div>
          </section>
        </div>`;
    }

    function renderTray() {
      document.getElementById('windowTitle').textContent = 'System Tray';
      const h = healthWord();
      const iconCls = !state.gatewayOn || state.health==='unavailable' ? 'bad' : state.health==='degraded' ? 'warn' : '';
      return `
        <div class="tray-scene">
          <div class="desktop-fake"></div>
          <div class="tray-pop">
            <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
              <div>
                <h3>OmniAPI</h3>
                <div class="sub">${h.text} · ${endpoint()}</div>
              </div>
              <span class="badge ${h.cls==='ok'?'badge-success':h.cls==='warn'?'badge-warning':'badge-danger'}">${h.text}</span>
            </div>
            <div class="tray-stats">
              <div><span>RPM</span><strong>42</strong></div>
              <div><span>队列</span><strong>2</strong></div>
              <div><span>凭据</span><strong>15</strong></div>
            </div>
            <div class="tray-channels">
              ${CHANNELS.map(c => `
                <div class="row">
                  <span>${c.name}</span>
                  <span class="badge ${c.status==='healthy'?'badge-success':c.status==='degraded'?'badge-warning':'badge-muted'}">${c.status==='healthy'?'健康':c.status==='degraded'?'降级':'未配置'}</span>
                </div>
              `).join('')}
            </div>
            <div class="tray-actions">
              <button class="btn btn-primary" data-act="mode" data-mode="app">打开面板</button>
              <button class="btn btn-secondary" data-act="copy-endpoint">复制 API 地址</button>
              <button class="btn btn-ghost" data-act="toast" data-msg="原型：重启网关核心进程">重启网关</button>
              <button class="btn btn-danger" data-act="toast" data-msg="退出将停止本地网关（需确认）">退出…</button>
            </div>
          </div>
          <div class="tray-taskbar">
            <span>12:04</span>
            <button class="tray-icon ${iconCls}" data-act="toast" data-msg="托盘图标 · 点击展开">O<span class="dot"></span></button>
          </div>
        </div>`;
    }

    function render() {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === state.mode));
      const stage = document.getElementById('stage');
      if (state.mode === 'wizard') stage.innerHTML = renderWizard();
      else if (state.mode === 'tray') stage.innerHTML = renderTray();
      else stage.innerHTML = renderApp();
      renderSide();
    }

    document.body.addEventListener('click', (e) => {
      const tab = e.target.closest('.mode-tab');
      if (tab) {
        state.mode = tab.dataset.mode;
        render();
        return;
      }

      const act = e.target.closest('[data-act]');
      if (!act) return;
      const type = act.dataset.act;

      if (type === 'mode') {
        state.mode = act.dataset.mode;
        if (state.mode === 'app') state.route = 'home';
        render();
        return;
      }
      if (type === 'nav') {
        state.mode = 'app';
        state.route = act.dataset.route;
        render();
        return;
      }
      if (type === 'wiz-next') {
        state.wizardStep = Math.min(4, state.wizardStep + 1);
        render();
        return;
      }
      if (type === 'wiz-prev') {
        state.wizardStep = Math.max(0, state.wizardStep - 1);
        render();
        return;
      }
      if (type === 'skip-wizard' || type === 'finish-wizard') {
        state.mode = 'app';
        state.route = 'home';
        render();
        toast(type === 'finish-wizard' ? '设置完成，已进入控制台' : '已跳过向导');
        return;
      }
      if (type === 'toggle-ch') {
        const id = act.dataset.id;
        if (state.selectedChannels.has(id)) state.selectedChannels.delete(id);
        else state.selectedChannels.add(id);
        render();
        return;
      }
      if (type === 'cred-mode') {
        state.credMode = act.dataset.mode;
        render();
        return;
      }
      if (type === 'save-cred') {
        const input = document.getElementById('tokenInput');
        if (input) state.tokenValue = input.value.trim();
        if (state.credMode === 'token' && !state.tokenValue) {
          toast('请先填写 Token');
          return;
        }
        // mark a channel configured in prototype
        const first = [...state.selectedChannels][0];
        const ch = CHANNELS.find(c => c.id === first);
        if (ch && ch.total === 0) { ch.total = 1; ch.avail = 1; ch.status = 'healthy'; }
        state.wizardStep = 3;
        state.tested = false;
        render();
        toast('凭据已保存（原型）');
        return;
      }
      if (type === 'run-test') {
        state.tested = true;
        state.health = 'healthy';
        render();
        toast('测试成功');
        return;
      }
      if (type === 'copy-endpoint') {
        const text = endpoint();
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).catch(()=>{});
        state.copied = true;
        toast('已复制 API 地址');
        return;
      }
      if (type === 'toggle-gateway') {
        state.gatewayOn = !state.gatewayOn;
        if (!state.gatewayOn) state.health = 'unavailable';
        else state.health = CHANNELS.some(c => c.status === 'degraded') ? 'degraded' : 'healthy';
        render();
        toast(state.gatewayOn ? '网关已启动（原型）' : '网关已停止（原型）');
        return;
      }
      if (type === 'toast') {
        toast(act.dataset.msg || 'ok');
      }
    });

    render();
  </script>
</body>
</html>
