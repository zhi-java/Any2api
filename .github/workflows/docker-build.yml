name: Docker Build and Push

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 注意：sha 规则不要写 prefix={{branch}}-。在 tag 事件下 {{branch}} 为空，
          # 会拼出 ":<sha>" 这类非法引用，导致 buildx 整体失败（历史上 7 月起每次构建
          # 都因此失败）。改用 format=short 生成裸短 sha。
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # 安全扫描为附加检查，不阻断镜像发布（镜像此时已推送成功）。
      - name: 扫描镜像安全漏洞
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # 必须用 metadata 输出的镜像引用：${{ github.repository }} 是
          # "zhi-java/Any2api"（含大写），而 OCI 引用不允许大写字母，
          # metadata-action 推送时已规范为小写 any2api，直接拼会解析失败。
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: 上传安全扫描结果
        if: github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
