# 生产环境 Docker Compose 配置
services:
  omni:
    build:
      context: .
      dockerfile: Dockerfile
    image: omni:production
    container_name: omni-prod
    restart: always
    ports:
      # 显式绑定 IPv4 全网卡。若省略主机地址，Docker 会同时绑 IPv4/IPv6，
      # 而 Windows 上 localhost 优先解析到 IPv6(::1)，其映射常不可达，
      # 导致浏览器/客户端用 localhost 访问时超时（需改用 127.0.0.1）。
      # 显式写 0.0.0.0 后，localhost 与 127.0.0.1 均可正常访问。
      - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      # DeepSeek 认证
      DS_TOKEN: ${DS_TOKEN:-}
      DS_TOKENS: ${DS_TOKENS:-}
      DS_ACCOUNTS: ${DS_ACCOUNTS:-}
      DS_ACCOUNTS_EXTENDED: ${DS_ACCOUNTS_EXTENDED:-}

      # 服务配置
      PORT: 3000
      API_KEY: ${API_KEY}
      API_KEYS: ${API_KEYS:-}

      # 数据目录：持久化 config.json（后台添加的凭据等）
      ZHI2API_DATA_DIR: /data

      # 代理配置
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}

      # Token 池调优
      MAX_CONCURRENT_PER_TOKEN: ${MAX_CONCURRENT_PER_TOKEN:-4}
      TOKEN_DEAD_THRESHOLD: ${TOKEN_DEAD_THRESHOLD:-5}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-600}
      IDLE_THRESHOLD: ${IDLE_THRESHOLD:-1800}

      # 会话管理
      SESSION_TTL: ${SESSION_TTL:-1800}

      # 日志配置
      LOG_DIR: /app/logs
      CLIENT_DEBUG_LOG: ${CLIENT_DEBUG_LOG:-false}
      CLIENT_DEBUG_LOG_DIR: ${CLIENT_DEBUG_LOG_DIR:-}
      CLIENT_DEBUG_LOG_MAX_CHARS: ${CLIENT_DEBUG_LOG_MAX_CHARS:-200000}

      # 功能开关
      MERGE_THINKING: ${MERGE_THINKING:-false}
      ENABLE_PROMPT_INJECTION: ${ENABLE_PROMPT_INJECTION:-true}
      SYSTEM_FINGERPRINT: ${SYSTEM_FINGERPRINT:-fp_omni_v1}
      ENABLE_CONVERSATION_AFFINITY: ${ENABLE_CONVERSATION_AFFINITY:-false}
      CONVERSATION_TTL_MS: ${CONVERSATION_TTL_MS:-1800000}
      MAX_CONVERSATIONS: ${MAX_CONVERSATIONS:-500}
      ENABLE_FC_ERROR_RETRY: ${ENABLE_FC_ERROR_RETRY:-true}

    volumes:
      # 持久化日志
      - logs:/app/logs
      # 持久化配置（config.json：后台添加的凭据、运行配置）
      - omni-data:/data

    networks:
      - omni-network

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  omni-network:
    driver: bridge

volumes:
  logs:
    driver: local
  # 配置数据卷：容器重建后凭据与运行配置不丢失
  omni-data:
    driver: local
