services:
  omni:
    # 默认直接使用已发布的通用镜像，用户无需本地构建即可运行。
    # 需要在本地从源码构建时，用：
    #   docker compose up -d --build
    image: ghcr.io/zhi-java/any2api:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: omni
    restart: unless-stopped
    ports:
      # 显式绑定 IPv4 全网卡。若省略主机地址，Docker 会同时绑 IPv4/IPv6，
      # 而 Windows 上 localhost 优先解析到 IPv6(::1)，其映射常不可达，
      # 导致浏览器/客户端用 localhost 访问时超时（需改用 127.0.0.1）。
      # 显式写 0.0.0.0 后，localhost 与 127.0.0.1 均可正常访问。
      - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      # 只需这三项；其余参数均有内置默认值，可在管理后台「设置」页面调整
      # （会持久化到 /data，重建容器后保留）。
      #
      # 上游认证（二选一）
      DS_ACCOUNTS: ${DS_ACCOUNTS:-}
      DS_TOKENS: ${DS_TOKENS:-}
      # 管理后台 Key（同时用作 API 请求 Key）
      API_KEY: ${API_KEY:-sk-zhi}
      # 可选：把 .env 中的 token 关联到账号，便于失效时自动重登。
      # 平时无需填写——账号与 token 的关联会自动持久化到 /data。
      DS_ACCOUNTS_EXTENDED: ${DS_ACCOUNTS_EXTENDED:-}

      # 容器内固定端口（宿主机端口由上方 ports 映射决定）
      PORT: 3000
      # 数据目录：持久化 config.json（后台添加的凭据、运行配置）
      ZHI2API_DATA_DIR: /data
      # 日志目录（挂载到宿主机 ./logs）
      LOG_DIR: /app/logs

      # ---- 低配服务器内存护栏（可按机器规格调整）----
      # 显式限制 V8 堆上限，让 GC 更早介入，避免被宿主 OOM Killer 直接杀掉
      # （进程被杀时不会有任何日志，最难排查）。建议为容器内存上限的 60%~75%。
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      # 请求体上限（MB）。原为硬编码 50MB，实测客户端最大约 2.3MB。
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-25}
      # 单次响应在内存中的捕获上限（字符）。超限后日志只记元数据+截断正文。
      LOG_RESPONSE_CAPTURE_MAX_CHARS: ${LOG_RESPONSE_CAPTURE_MAX_CHARS:-262144}
      # 近期日志内存条数上限
      LOG_MEMORY_LIMIT: ${LOG_MEMORY_LIMIT:-300}
      # 排队请求上限
      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-50}

      # 出站代理（可选，需要时取消注释）
      # HTTPS_PROXY: ${HTTPS_PROXY:-}
      # HTTP_PROXY: ${HTTP_PROXY:-}

    volumes:
      # 持久化日志
      - ./logs:/app/logs
      # 持久化配置（config.json：后台添加的凭据、运行配置）
      - omni-data:/data
      # 如果需要自定义配置文件，可以挂载 .env
      # - ./.env:/app/.env:ro

    networks:
      - omni-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  omni-network:
    driver: bridge

volumes:
  logs:
    driver: local
  # 配置数据卷：容器重建后凭据与运行配置不丢失
  omni-data:
    driver: local
