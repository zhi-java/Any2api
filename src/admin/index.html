<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAPI 控制台</title>
  <style>
    :root {
      color-scheme: light;
      --bg-canvas: #fafbff;
      --bg-panel: #ffffff;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --danger: #ef4444;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.05);
      --font-sans: "Plus Jakarta Sans", Inter, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); }
    [hidden] { display: none !important; }
    .login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 10%, rgba(79, 70, 229, 0.10), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(6, 182, 212, 0.08), transparent 24%),
        var(--bg-canvas);
    }
    .login-card {
      width: min(420px, 100%);
      display: grid;
      gap: 14px;
      padding: 28px;
      background: var(--bg-panel);
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5 55%, #06b6d4);
      color: white;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.28);
    }
    .login-card h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 800; }
    .login-card p { margin: 0 0 8px; color: var(--text-secondary); line-height: 1.6; }
    .field-label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: #fff;
      color: var(--text-primary);
      padding: 10px 12px;
      font: inherit;
    }
    .input:focus { outline: 3px solid rgba(79, 70, 229, 0.16); border-color: var(--accent); }
    .btn {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.22); }
    .btn-primary:hover { background: var(--accent-strong); color: white; }
    .form-error {
      padding: 10px 12px;
      border-radius: 12px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid rgba(239, 68, 68, 0.28);
    }
    .boot-message { color: var(--text-secondary); text-align: center; }
  </style>
</head>
<body>
  <div id="loginView" class="login-view" hidden>
    <form id="loginForm" class="login-card">
      <div class="brand-mark">O</div>
      <h1>OmniAPI 控制台</h1>
      <p>登录后查看服务状态、复制接入地址，并管理渠道与凭据。</p>
      <label class="field-label" for="apiKeyInput">API Key</label>
      <input id="apiKeyInput" class="input" type="password" autocomplete="current-password" placeholder="sk-...">
      <div id="authError" class="form-error" role="alert" hidden></div>
      <button id="loginButton" class="btn btn-primary" type="submit">登录</button>
    </form>
  </div>

  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar" aria-label="主导航">
      <div class="sidebar-brand"><div class="brand-mark">O</div><div><strong>OmniAPI</strong><span>本地 AI 网关</span></div></div>
      <nav id="nav" class="sidebar-nav"></nav>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div><p id="sectionEyebrow" class="eyebrow">Home</p><h1 id="sectionTitle">首页</h1></div>
        <div id="topbarStatus" class="topbar-status">
          <button id="logoutBtn" class="icon-btn" type="button" aria-label="退出登录" title="退出登录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V6H6v12h3v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5Zm6.3 4.3 3 3a1 1 0 0 1 0 1.4l-3 3a1 1 0 1 1-1.4-1.4l1.29-1.3H10a1 1 0 1 1 0-2h6.19L14.9 9.7a1 1 0 0 1 1.4-1.4Z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>
      <section id="viewRoot" class="view-root" aria-live="polite"><p class="boot-message">加载中...</p></section>
    </main>
  </div>

  <div id="toastRoot" class="toast-root"></div>

  <script>
    const loginView = document.getElementById('loginView');
    const appShell = document.getElementById('appShell');
    const authError = document.getElementById('authError');
    const loginButton = document.getElementById('loginButton');
    let appLoaded = false;

    function setAuthenticated(authenticated) {
      loginView.hidden = authenticated;
      appShell.hidden = !authenticated;
    }

    async function jsonRequest(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      if (!response.ok) {
        let message = `HTTP ${response.status}`;
        try {
          const body = await response.json();
          message = body?.error?.message || message;
        } catch {}
        throw new Error(message);
      }
      return response.json();
    }

    function loadStylesheet(href) {
      return new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.onload = resolve;
        link.onerror = reject;
        document.head.appendChild(link);
      });
    }

    function loadScript(src, type) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        if (type) script.type = type;
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }

    async function loadApp() {
      if (appLoaded) return;
      appLoaded = true;
      await Promise.all([
        loadStylesheet('/admin/styles/design-system.css'),
        loadStylesheet('/admin/styles/layout.css'),
        loadStylesheet('/admin/styles/components.css'),
      ]);
      await loadScript('/admin/vendor/chart.umd.min.js');
      await loadScript('/admin/scripts/app.js', 'module');
    }

    async function checkAuth() {
      try {
        const status = await jsonRequest('/admin/api/auth/status');
        if (!status.authRequired || status.authenticated) {
          setAuthenticated(true);
          await loadApp();
          return;
        }
      } catch {}
      setAuthenticated(false);
    }

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      authError.hidden = true;
      loginButton.disabled = true;
      try {
        await jsonRequest('/admin/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ apiKey }),
        });
        document.getElementById('apiKeyInput').value = '';
        setAuthenticated(true);
        await loadApp();
        window.dispatchEvent(new CustomEvent('admin:authenticated'));
      } catch (error) {
        authError.textContent = error.message === 'Invalid API key' ? 'API Key 无效' : error.message;
        authError.hidden = false;
      } finally {
        loginButton.disabled = false;
      }
    });

    window.addEventListener('auth:expired', () => setAuthenticated(false));
    checkAuth();
  </script>
</body>
</html>
