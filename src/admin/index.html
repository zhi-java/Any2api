<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - zhi2Api</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/layout.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <style>
    .test-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(0, 0, 0, 0.4);
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .test-modal.active { display: flex; }

    .test-dialog {
      width: min(800px, 100%);
      max-height: min(700px, 90vh);
      overflow: hidden;
      display: grid;
      grid-template-columns: 280px 1fr;
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .test-config {
      padding: var(--space-4);
      border-right: 1px solid var(--border-default);
      background: var(--bg-primary);
      overflow-y: auto;
    }

    .test-output {
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    .test-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .test-head h2 { margin-bottom: 0; font-size: var(--text-lg); }

    .field { margin-bottom: var(--space-3); }
    .field label {
      display: block;
      margin-bottom: var(--space-1);
      color: var(--text-secondary);
      font-size: var(--text-sm);
      font-weight: 500;
    }

    #testPrompt {
      min-height: 120px;
      resize: vertical;
    }

    .test-stream {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      background: var(--bg-primary);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: var(--text-sm);
      font-family: var(--font-mono);
    }

    .test-reasoning {
      display: none;
      margin-top: var(--space-3);
      border-left: 3px solid var(--info);
      padding: var(--space-2) var(--space-3);
      background: var(--info-light);
      font-size: var(--text-sm);
      max-height: 150px;
      overflow-y: auto;
    }

    .test-status {
      min-height: 20px;
      margin-top: var(--space-2);
      color: var(--text-secondary);
      font-size: var(--text-sm);
    }

    @media (max-width: 800px) {
      .test-dialog { grid-template-columns: 1fr; }
      .test-config { border-right: none; border-bottom: 1px solid var(--border-default); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">zhi2Api</div>
        <div class="version">v1.0.0</div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="deepseek">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>
          <span class="nav-label">DeepSeek</span>
        </a>
        <a href="#" class="nav-item" data-page="glm">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>
          <span class="nav-label">GLM</span>
        </a>
        <a href="#" class="nav-item" data-page="channels" data-src="/admin/pages/channels.html?channel=qwen">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></svg></span>
          <span class="nav-label">Qwen</span>
        </a>
        <a href="#" class="nav-item" data-page="channels" data-src="/admin/pages/channels.html?channel=kimi">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></span>
          <span class="nav-label">Kimi</span>
        </a>
        <a href="#" class="nav-item" data-page="channels">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg></span>
          <span class="nav-label">渠道</span>
        </a>
        <a href="#" class="nav-item" data-page="logs">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
          <span class="nav-label">日志</span>
        </a>
        <a href="#" class="nav-item" data-page="performance">
          <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
          <span class="nav-label">性能</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn" id="channelTestBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          测试
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="content">
      <iframe id="content-frame" src="/admin/pages/dashboard.html"></iframe>
    </main>
  </div>

  <!-- 登录弹窗 -->
  <div id="authOverlay" class="auth-overlay active">
    <div class="auth-dialog">
      <h2>Admin 登录</h2>
      <p>请输入 API Key 以访问管理面板</p>
      <div class="auth-form">
        <div class="auth-error" id="authError">API Key 无效，请重试</div>
        <input type="password" id="apiKeyInput" class="input" placeholder="输入 API Key (sk-...)" autocomplete="off" />
        <button class="btn btn-primary" onclick="handleLogin()">登录</button>
      </div>
    </div>
  </div>

  <!-- 渠道测试弹窗 -->
  <div class="test-modal" id="channelTestModal" role="dialog" aria-modal="true" aria-labelledby="channelTestTitle">
    <div class="test-dialog">
      <div class="test-config">
        <div class="field">
          <label for="testChannel">选择渠道</label>
          <select class="select" id="testChannel" style="width:100%">
            <option value="deepseek">DeepSeek</option>
            <option value="glm">GLM</option>
            <option value="qwen">Qwen</option>
            <option value="kimi">Kimi</option>
          </select>
        </div>
        <div class="field">
          <label for="testModel">模型</label>
          <select class="select" id="testModel" style="width:100%">
            <option value="deepseek-chat">deepseek-chat</option>
          </select>
        </div>
        <div class="field">
          <label for="testPrompt">Prompt</label>
          <textarea id="testPrompt" class="input" style="width:100%">Hello, what can you do? 请简要回答。</textarea>
        </div>
        <button class="btn btn-primary" id="sendTestRequest" style="width:100%">发送测试请求</button>
        <div class="test-status" id="channelTestStatus"></div>
      </div>
      <div class="test-output">
        <div class="test-head">
          <h2 id="channelTestTitle">输出</h2>
          <button class="btn btn-sm btn-ghost" onclick="closeChannelTest()">✕</button>
        </div>
        <div class="test-stream" id="channelTestOutput">等待发送测试请求</div>
        <div class="test-reasoning" id="channelTestReasoning"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // ============= 导航 =============
    const navItems = document.querySelectorAll('.nav-item');
    const contentFrame = document.getElementById('content-frame');

    navItems.forEach(item => {
      item.addEventListener('click', event => {
        event.preventDefault();
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        const page = item.dataset.page;
        contentFrame.src = item.dataset.src || `/admin/pages/${page}.html`;
      });
    });

    document.getElementById('channelTestBtn').addEventListener('click', () => {
      openChannelTest();
    });

    contentFrame.addEventListener('load', () => {
      console.log('[Admin] Page loaded');
    });

    // ============= API Key 注入 =============
    let apiKey = localStorage.getItem('admin_api_key');

    window.addEventListener('message', event => {
      if (event.data.type === 'getApiKey') {
        event.source.postMessage({ type: 'apiKey', key: apiKey }, event.origin);
      }
    });

    // ============= 认证 =============
    async function checkAuth() {
      try {
        const response = await fetch('/admin/api/auth/status', { credentials: 'same-origin' });
        const status = await response.json();
        if (!status.authRequired || status.authenticated) {
          document.getElementById('authOverlay').classList.remove('active');
          return true;
        }
        document.getElementById('authOverlay').classList.add('active');
        return false;
      } catch (err) {
        console.error('Auth check failed:', err);
        document.getElementById('authOverlay').classList.add('active');
        return false;
      }
    }

    window.handleLogin = async function() {
      const apiKeyInput = document.getElementById('apiKeyInput');
      const authError = document.getElementById('authError');
      const key = apiKeyInput.value.trim();

      if (!key) {
        authError.textContent = '请输入 API Key';
        authError.classList.add('active');
        return;
      }

      try {
        const result = await fetch('/admin/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: key }),
        });
        const data = await result.json();

        if (data.success || data.authenticated) {
          apiKey = key;
          localStorage.setItem('admin_api_key', key);
          document.getElementById('authOverlay').classList.remove('active');
          authError.classList.remove('active');
        } else {
          authError.textContent = 'API Key 无效';
          authError.classList.add('active');
        }
      } catch (err) {
        authError.textContent = `验证失败: ${err.message}`;
        authError.classList.add('active');
      }
    };

    document.getElementById('apiKeyInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') handleLogin();
    });

    checkAuth();

    // ============= 渠道测试 =============
    window.openChannelTest = function() {
      document.getElementById('channelTestModal').classList.add('active');
      loadTestModels();
    };

    window.closeChannelTest = function() {
      document.getElementById('channelTestModal').classList.remove('active');
    };

    async function loadTestModels() {
      try {
        const result = await fetch('/admin/api/channels/deepseek/config');
        // 加载成功后默认保留
      } catch (err) {
        console.warn('Failed to load models:', err);
      }
    }

    document.getElementById('testChannel').addEventListener('change', () => {
      document.getElementById('channelTestStatus').textContent = '';
    });

    document.getElementById('sendTestRequest').addEventListener('click', sendTestRequest);

    async function sendTestRequest() {
      const channel = document.getElementById('testChannel').value;
      const model = document.getElementById('testModel').value;
      const prompt = document.getElementById('testPrompt').value.trim();
      const output = document.getElementById('channelTestOutput');
      const reasoning = document.getElementById('channelTestReasoning');
      const status = document.getElementById('channelTestStatus');

      if (!prompt) { status.textContent = '请输入 Prompt'; return; }

      output.textContent = '等待响应...';
      reasoning.style.display = 'none';
      status.textContent = '请求中...';

      try {
        const response = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            messages: [{ role: 'user', content: prompt }],
            stream: true,
          }),
        });

        if (!response.ok) {
          const error = await response.text();
          output.textContent = `HTTP ${response.status}: ${error}`;
          status.textContent = '请求失败';
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullOutput = '';
        let fullReasoning = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const text = decoder.decode(value, { stream: true });
          const lines = text.split('\n');

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (!data || data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              const choices = json.choices || [];
              for (const choice of choices) {
                const delta = choice.delta || {};
                if (delta.reasoning_content) {
                  fullReasoning += delta.reasoning_content;
                  reasoning.style.display = 'block';
                  reasoning.textContent = fullReasoning;
                }
                if (delta.content) {
                  fullOutput += delta.content;
                  output.textContent = fullOutput;
                }
              }
            } catch (e) {
              // skip parse errors
            }
          }
        }

        status.textContent = '响应完成';
      } catch (err) {
        output.textContent = `错误: ${err.message}`;
        status.textContent = '请求失败';
      }
    }

    // 关闭弹窗（点击背景）
    document.getElementById('channelTestModal').addEventListener('click', event => {
      if (event.target.id === 'channelTestModal') closeChannelTest();
    });

    // 每次打开测试弹窗时清空状态
    document.getElementById('channelTestModal').addEventListener('transitionend', () => {
      if (!document.getElementById('channelTestModal').classList.contains('active')) {
        document.getElementById('channelTestOutput').textContent = '等待发送测试请求';
        document.getElementById('channelTestReasoning').style.display = 'none';
        document.getElementById('channelTestStatus').textContent = '';
      }
    });
  </script>
</body>
</html>
