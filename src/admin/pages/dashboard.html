<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <script src="/admin/vendor/chart.umd.min.js"></script>
  <style>
    .stat-row { display: flex; gap: var(--space-3); flex-shrink: 0; }
    .stat-row .stat-card { flex: 1; min-width: 0; }
    .bottom-row { display: flex; gap: var(--space-3); flex: 1; min-height: 0; }
    .bottom-row .card { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chart-box { flex: 1; min-height: 0; position: relative; }
    .chart-box canvas { max-height: 100%; width: 100% !important; }
    .table-box { flex: 1; min-height: 0; overflow: hidden; }
    .table-box table { font-size: var(--text-xs); }
    .table-box td, .table-box th { padding: 3px 8px; }
    .table-box tbody tr:last-child td { border-bottom: 1px solid var(--border-subtle); }
    .listen-box { flex-shrink: 0; display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); background: var(--bg-surface); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); }
    .listen-box .badge { flex-shrink: 0; }
    @media (max-width: 700px) { .bottom-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header"><h1>Dashboard</h1></div>
    <div class="page-body">
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">请求总数</div><div class="stat-value" id="stat-requests">-</div><div class="stat-change" id="stat-requests-change"></div></div>
        <div class="stat-card"><div class="stat-label">成功率</div><div class="stat-value" id="stat-success-rate">-</div><div class="stat-change" id="stat-success-change"></div></div>
        <div class="stat-card"><div class="stat-label">可用凭据</div><div class="stat-value" id="stat-tokens">-</div><div class="stat-change" id="stat-tokens-change"></div></div>
      </div>
      <div class="bottom-row">
        <div class="card">
          <div class="card-header"><div class="card-title">请求趋势</div></div>
          <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">渠道状态</div></div>
          <div class="table-box"><div class="table-wrap">
            <table class="table" id="channelTable"><thead><tr><th>渠道</th><th>状态</th><th>凭据</th><th>错误</th></tr></thead><tbody id="channelBody"><tr><td colspan="4" class="empty-state">…</td></tr></tbody></table>
          </div></div>
        </div>
      </div>
      <div class="listen-box"><span class="badge badge-info">地址</span><span id="systemAddr">加载中...</span></div>
    </div>
  </div>
  <script type="module">
    import API from '/admin/scripts/api.js'; import PollingManager from '/admin/scripts/polling.js';
    import { initChartDefaults } from '/admin/scripts/charts.js'; initChartDefaults();
    const h={l:[],d:[],max:20}; const c=new Chart(document.getElementById('chart'),{type:'line',data:{labels:h.l,datasets:[{label:'请求',data:h.d,borderColor:'#0a84ff',fill:!1,tension:.2,pointRadius:0}]},options:{responsive:!0,maintainAspectRatio:!1,plugins:{legend:{display:!1}},scales:{x:{grid:{display:!1},ticks:{font:{size:9},maxTicksLimit:6}},y:{beginAtZero:!0,grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:9}}}}}});
    function escape(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
    async function up(){try{
      const s=await API.getStats(); const ch=s.channels||[];
      const n=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      const tr=s.logStats?.totalRequests||0; const sc=s.logStats?.successCount||0;
      document.getElementById('stat-requests').textContent=tr>=1e6?(tr/1e6).toFixed(1)+'M':tr>=1e3?(tr/1e3).toFixed(1)+'K':String(tr);
      document.getElementById('stat-requests-change').textContent=s.logStats?.last5min+' / 5分';
      document.getElementById('stat-success-rate').textContent=(tr>0?(sc/tr*100).toFixed(1):'0')+'%';
      document.getElementById('stat-success-change').textContent=sc+' 成功';
      const ak=ch.reduce((s,c)=>s+(c.availableCount||0),0);
      document.getElementById('stat-tokens').textContent=ak;
      document.getElementById('stat-tokens-change').textContent=ch.filter(c=>c.status==='healthy').length+' 健康';
      h.l.push(n);h.d.push(tr);if(h.l.length>h.max){h.l.shift();h.d.shift()}c.update();
      const tb=document.getElementById('channelBody');
      if(!ch.length) tb.innerHTML='<tr><td colspan="4" class="empty-state">无数据</td></tr>';
      else tb.innerHTML=ch.map(c=>{
        const st=c.status==='healthy'?'badge-success':c.status==='degraded'?'badge-warning':'badge-default';
        const sl=c.status==='healthy'?'健康':c.status==='degraded'?'降级':'未配置';
        const u=c.usage||{};
        return `<tr><td>${escape(c.name||c.id)}</td><td><span class="badge ${st}">${sl}</span></td><td>${c.availableCount||0}/${c.credentialCount||0}</td><td class="${(u.errors||0)>0?'text-error':'text-success'}">${u.errors||0}</td></tr>`;
      }).join('');
      const a=document.getElementById('systemAddr');
      if(s.serverUrl){a.textContent=s.serverUrl+`  ·  POST /v1/chat/completions`}
      else a.textContent='信息获取中...';
    }catch(e){console.error(e)}}
    new PollingManager(5000).start(up); window.addEventListener('beforeunload',()=>poller.stop());
  </script>
</body>
</html>
