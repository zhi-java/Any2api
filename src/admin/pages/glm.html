<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLM</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <style>
    .top-row { display: flex; gap: var(--space-3); flex-shrink: 0; }
    .top-row .stat-card { flex: 1; }
    .table-box { flex: 1; min-height: 0; }
    .table-box table { font-size: var(--text-xs); }
    .table-box td, .table-box th { padding: 3px 8px; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header"><h1>GLM</h1></div>
    <div class="page-body">
      <div class="top-row">
        <div class="stat-card"><div class="stat-label">模式</div><div class="stat-value" id="overviewMode">-</div><div class="stat-change" id="overviewModeStatus"></div></div>
        <div class="stat-card"><div class="stat-label">Token</div><div class="stat-value" id="overviewTokens">-</div><div class="stat-change" id="overviewTokensStatus"></div></div>
        <div style="display:flex;gap:var(--space-2);align-items:flex-end;padding-bottom:2px;">
          <button class="btn btn-sm btn-secondary" onclick="switchGuest()">访客</button>
          <button class="btn btn-sm btn-primary" onclick="addToken()">+ 添加</button>
        </div>
      </div>
      <div class="card table-box"><div class="table-wrap">
        <table class="table">
          <thead><tr><th>Token</th><th>状态</th><th></th></tr></thead>
          <tbody id="tokenBody"><tr><td colspan="3" class="empty-state">…</td></tr></tbody>
        </table>
      </div></div>
    </div>
  </div>
  <script type="module">
    import API from '/admin/scripts/api.js'; import PollingManager from '/admin/scripts/polling.js';
    window.switchGuest=async()=>{try{await API.updateChannelConfig('glm',{refreshTokens:[],guestMode:true});up()}catch(e){alert(e.message)}};
    window.addToken=async()=>{const t=prompt('GLM Refresh Token');if(!t)return;try{await API.addCredential('glm',{type:'token',refreshToken:t.trim()});up()}catch(e){alert(e.message)}};
    window.removeToken=async id=>{if(!confirm('删除？'))return;try{await API.removeCredential('glm',id);up()}catch(e){alert(e.message)}};
    async function up(){try{
      const[s,c]=await Promise.all([API.getStats(),API.getChannelConfig('glm')]);
      const tks=c.config?.refreshTokens||[]; const ok=tks.length>0;
      document.getElementById('overviewMode').textContent=ok?'用户':'访客';
      document.getElementById('overviewModeStatus').textContent=ok?'已配置':'临时 Token';
      document.getElementById('overviewTokens').textContent=tks.length;
      document.getElementById('overviewTokensStatus').textContent=ok?'已保存':'自动';
      const tb=document.getElementById('tokenBody');
      if(!tks.length){tb.innerHTML='<tr><td colspan="3" class="empty-state">访客模式，无需配置</td></tr>';return}
      tb.innerHTML=tks.map(t=>`<tr><td><code style="font-size:13px">${t.label}</code></td><td><span class="badge badge-default">已保存</span></td><td><button class="btn btn-sm btn-ghost" onclick="removeToken('${t.id}')">删</button></td></tr>`).join('');
    }catch(e){console.error(e)}}
    const p=new PollingManager(10000);p.start(up);window.addEventListener('beforeunload',()=>p.stop());
  </script>
</body>
</html>
