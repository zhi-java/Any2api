<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <style>
    .top-bar { display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; }
    .top-bar .stat-card { flex: 1; max-width: 220px; margin-bottom: 0; }
    .table-box { flex: 1; min-height: 0; }
    .table-box table { font-size: var(--text-xs); }
    .table-box td, .table-box th { padding: 3px 7px; }
    .table-box tbody tr:last-child td { border-bottom: 1px solid var(--border-subtle); }
    .token-prefix { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header"><h1>DeepSeek</h1></div>
    <div class="page-body">
      <div class="top-bar">
        <div class="stat-card"><div class="stat-label">Token</div><div class="stat-value" id="overviewTokens">-</div><div class="stat-change" id="overviewTokensStatus"></div></div>
        <div style="display:flex;gap:var(--space-2);align-self:flex-end;">
          <button class="btn btn-sm btn-primary" onclick="openAddTokenModal()">+ Token</button>
          <button class="btn btn-sm btn-secondary" onclick="openAddAccountModal()">+ 账号</button>
        </div>
      </div>
      <div class="card table-box"><div class="table-wrap">
        <table class="table">
          <thead><tr><th>Token</th><th>状态</th><th>邮箱</th><th>并发</th><th>错误</th><th>视觉</th><th></th></tr></thead>
          <tbody id="tokenBody"><tr><td colspan="7" class="empty-state">…</td></tr></tbody>
        </table>
      </div></div>
    </div>
  </div>
  <div id="addTokenModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3>添加 Token</h3></div>
    <div class="modal-body"><input type="text" id="tokenInput" class="input" style="width:100%" placeholder="DeepSeek Token" /></div>
    <div class="modal-footer"><button class="btn btn-sm btn-secondary" onclick="closeModal('addTokenModal')">取消</button><button class="btn btn-sm btn-primary" onclick="addToken()">保存</button></div>
  </div></div>
  <div id="addAccountModal" class="modal"><div class="modal-content">
    <div class="modal-header"><h3>添加账号</h3></div>
    <div class="modal-body">
      <div class="form-group"><input type="email" id="emailInput" class="input" style="width:100%" placeholder="邮箱" /></div>
      <div class="form-group"><input type="password" id="passwordInput" class="input" style="width:100%" placeholder="密码" /></div>
    </div>
    <div class="modal-footer"><button class="btn btn-sm btn-secondary" onclick="closeModal('addAccountModal')">取消</button><button class="btn btn-sm btn-primary" onclick="addAccount()">保存</button></div>
  </div></div>
  <script type="module">
    import API from '/admin/scripts/api.js'; import PollingManager from '/admin/scripts/polling.js';
    window.openAddTokenModal=()=>document.getElementById('addTokenModal').classList.add('active');
    window.openAddAccountModal=()=>document.getElementById('addAccountModal').classList.add('active');
    window.closeModal=id=>document.getElementById(id).classList.remove('active');
    window.addToken=async()=>{const t=document.getElementById('tokenInput').value.trim(); if(!t)return; try{await API.addCredential('deepseek',{type:'token',token:t});document.getElementById('tokenInput').value='';closeModal('addTokenModal');up()}catch(e){alert(e.message)}};
    window.addAccount=async()=>{const e=document.getElementById('emailInput').value.trim(),p=document.getElementById('passwordInput').value.trim(); if(!e||!p)return; try{await API.addCredential('deepseek',{type:'account',email:e,password:p});document.getElementById('emailInput').value='';document.getElementById('passwordInput').value='';closeModal('addAccountModal');up()}catch(e){alert(e.message)}};
    window.removeToken=async p=>{if(!confirm('确定删除？'))return; try{await API.removeToken(p);up()}catch(e){alert(e.message)}};
    async function up(){try{
      const s=await API.getStats(); const pool=s.pool||[];
      document.getElementById('overviewTokens').textContent=pool.filter(t=>!t.dead).length;
      document.getElementById('overviewTokensStatus').textContent='共 '+pool.length+' 个';
      const tb=document.getElementById('tokenBody');
      if(!pool.length){tb.innerHTML='<tr><td colspan="7" class="empty-state">空</td></tr>';return}
      tb.innerHTML=pool.map(t=>{
        const sc=t.dead?'badge-error':t.activeRequests>0?'badge-success':'badge-default';
        const sl=t.dead?'失效':t.activeRequests>0?'活跃':'空闲';
        const pre=t.token!=='NONE'?t.token.substring(0,12)+'…':'NONE';
        const vc=t.visionCapable===true?'badge-success':t.visionCapable===false?'badge-error':'badge-default';
        const vl=t.visionCapable===true?'✓':t.visionCapable===false?'✗':'?';
        return `<tr><td><code class="token-prefix">${pre}</code></td><td><span class="badge ${sc}">${sl}</span></td><td>${t.email||'-'}</td><td>${t.activeRequests||0}/${t.maxConcurrent||1}</td><td class="${t.errorCount>0?'text-error':''}">${t.errorCount}</td><td><span class="badge ${vc}">${vl}</span></td><td>${t.token==='NONE'?'':`<button class="btn btn-sm btn-ghost" onclick="removeToken('${pre}')">删</button>`}</td></tr>`;
      }).join('');
    }catch(e){console.error(e)}}
    const p=new PollingManager(5000);p.start(up);window.addEventListener('beforeunload',()=>p.stop());
    document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('active')}));
  </script>
</body>
</html>
