<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <style>
    .log-box { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-surface); border-radius: var(--radius-xl); overflow: hidden; }
    .log-list { flex: 1; min-height: 0; overflow: hidden; }
    .log-line { font-family: var(--font-mono); font-size: 13px; padding: 2px 8px; border-bottom: 1px solid var(--border-subtle); display: flex; gap: var(--space-2); align-items: flex-start; }
    .log-line:hover { background: var(--accent-light); }
    .log-time { color: var(--text-tertiary); flex-shrink: 0; min-width: 62px; }
    .log-level { flex-shrink: 0; min-width: 40px; font-weight: 600; font-size: 12px; }
    .log-level.INFO { color: var(--info); }
    .log-level.ERROR { color: var(--error); }
    .log-level.WARN { color: var(--warning); }
    .log-level.SUCCESS { color: var(--success); }
    .log-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
    .log-footer { flex-shrink: 0; padding: 3px 10px; text-align: center; color: var(--text-tertiary); font-size: 13px; border-top: 1px solid var(--border-subtle); }
    .toolbar .select, .toolbar .input { font-size: 14px; padding: 3px 7px; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header"><h1>日志</h1></div>
    <div class="page-body">
      <div class="toolbar" style="flex-shrink:0;padding:var(--space-2) var(--space-3);">
        <div class="toolbar-left">
          <select class="select" id="logCount" style="width:80px;"><option value="30">30</option><option value="60">60</option><option value="100">100</option></select>
          <select class="select" id="channelFilter" style="width:100px;"><option value="all">全部</option><option value="deepseek">DeepSeek</option><option value="glm">GLM</option><option value="qwen">Qwen</option><option value="kimi">Kimi</option></select>
          <input type="text" class="input" id="searchInput" placeholder="搜索…" style="flex:1;min-width:80px;" />
        </div>
        <div class="toolbar-right"><span class="text-tertiary text-xs" id="refreshLabel">自动</span><button class="btn btn-sm btn-secondary" onclick="refresh()">刷新</button></div>
      </div>
      <div class="log-box">
        <div class="log-list" id="logList"><div style="padding:var(--space-4);text-align:center;color:var(--text-tertiary);font-size:var(--text-xs)">加载中…</div></div>
        <div class="log-footer"><span id="logCountLabel">-</span> 条</div>
      </div>
    </div>
  </div>
  <script type="module">
    import API from '/admin/scripts/api.js'; import PollingManager from '/admin/scripts/polling.js';
    let logs=[];
    function escape(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
    function fmt(v){if(!v)return'-';const d=new Date(v);return isNaN(d.getTime())?v:d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
    function render(){
      const el=document.getElementById('logList');
      document.getElementById('logCountLabel').textContent=logs.length;
      if(!logs.length){el.innerHTML='<div style="padding:var(--space-4);text-align:center;color:var(--text-tertiary);font-size:var(--text-xs)">无</div>';return}
      el.innerHTML=logs.slice(0,60).map(l=>`<div class="log-line"><span class="log-time">${fmt(l.time)}</span><span class="log-level ${l.level}">${l.level||''}</span><span class="log-msg">${escape(l.message)}</span></div>`).join('');
    }
    window.refresh=()=>update();
    let ft=null;
    window.changeFilters=()=>{clearTimeout(ft);ft=setTimeout(update,200)};
    async function update(){try{
      const cnt=parseInt(document.getElementById('logCount').value);
      const f={channel:document.getElementById('channelFilter').value,model:'all',status:'all',search:document.getElementById('searchInput').value.trim()};
      const r=await API.getLogs(cnt,f); logs=r.logs||[]; render();
    }catch(e){console.error(e)}}
    document.getElementById('logCount').addEventListener('change',update);
    document.getElementById('channelFilter').addEventListener('change',update);
    document.getElementById('searchInput').addEventListener('keyup',()=>{clearTimeout(ft);ft=setTimeout(update,200)});
    update();
    const p=new PollingManager(5000);p.start(update);window.addEventListener('beforeunload',()=>p.stop());
  </script>
</body>
</html>
