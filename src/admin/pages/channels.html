<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渠道管理</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <style>
    .stat-row { display: flex; gap: var(--space-2); flex-shrink: 0; }
    .stat-row .stat-card { flex: 1; padding: var(--space-2) var(--space-3); }
    .stat-row .stat-value { font-size: var(--text-lg); }
    .tables-row { display: flex; gap: var(--space-2); flex: 1; min-height: 0; }
    .tables-row .card { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: var(--space-2); }
    .tables-row .table-wrap { flex: 1; min-height: 0; }
    .tables-row table { font-size: 14px; }
    .tables-row td, .tables-row th { padding: 2px 5px; }
    .cap-line { display: flex; flex-wrap: wrap; gap: 2px; }
    .cap-line .badge { font-size: 12px; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header"><h1>渠道管理</h1></div>
    <div class="page-body">
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">健康</div><div class="stat-value text-success" id="statHealthy">-</div></div>
        <div class="stat-card"><div class="stat-label">降级</div><div class="stat-value text-warning" id="statDegraded">-</div></div>
        <div class="stat-card"><div class="stat-label">未配置</div><div class="stat-value" id="statUnconfigured">-</div></div>
        <div class="stat-card"><div class="stat-label">模型</div><div class="stat-value" id="statModels">-</div></div>
      </div>
      <div class="tables-row">
        <div class="card">
          <div class="card-header" style="margin-bottom:var(--space-1)"><div class="card-title">渠道</div><select class="select" id="channelFilter" style="width:auto;font-size:13px;padding:1px 4px;"><option value="all">全部</option><option value="deepseek">DeepSeek</option><option value="glm">GLM</option><option value="qwen">Qwen</option><option value="kimi">Kimi</option></select></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>渠道</th><th>状态</th><th>凭据</th><th>错误</th></tr></thead><tbody id="channelsBody"><tr><td colspan="4" class="empty-state">…</td></tr></tbody></table></div>
        </div>
        <div class="card">
          <div class="card-header" style="margin-bottom:var(--space-1)"><div class="card-title">模型</div><input class="input" id="modelSearch" type="text" placeholder="搜索…" style="font-size:13px;padding:1px 4px;width:100px;"></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>模型</th><th>能力</th></tr></thead><tbody id="modelsBody"><tr><td colspan="2" class="empty-state">…</td></tr></tbody></table></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import API from '/admin/scripts/api.js'; import PollingManager from '/admin/scripts/polling.js';
    let channels=[], models=[];
    function escape(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
    function capBadge(l,e){return`<span class="badge ${e?'badge-success':'badge-default'}" style="font-size:12px;padding:1px 3px;border-radius:2px">${l}</span>`}
    function render(){
      const f=document.getElementById('channelFilter').value;
      const tb=document.getElementById('channelsBody');
      const vc=f==='all'?channels:channels.filter(c=>c.id===f);
      if(!vc.length){tb.innerHTML='<tr><td colspan="4" class="empty-state">空</td></tr>';return}
      tb.innerHTML=vc.map(c=>{
        const st=c.status==='healthy'?'badge-success':c.status==='degraded'?'badge-warning':'badge-default';
        const sl=c.status==='healthy'?'健康':c.status==='degraded'?'降级':'未配置';
        const u=c.usage||{};
        return `<tr><td><strong>${escape(c.name||c.id)}</strong></td><td><span class="badge ${st}" style="font-size:12px">${sl}</span></td><td>${c.availableCount||0}/${c.credentialCount||0}</td><td class="${(u.errors||0)>0?'text-error':''}">${u.errors||0}</td></tr>`;
      }).join('');
      const mb=document.getElementById('modelsBody');
      const q=document.getElementById('modelSearch').value.trim().toLowerCase();
      const fm=f==='all'?models:models.filter(m=>m.channel===f);
      const filtered=q?fm.filter(m=>String(m.id).toLowerCase().includes(q)):fm;
      if(!filtered.length){mb.innerHTML='<tr><td colspan="2" class="empty-state">无</td></tr>';return}
      mb.innerHTML=filtered.slice(0,50).map(m=>{
        const cap=m.capabilities||{}; const ch=[capBadge('文本',cap.text!==!1),capBadge('思考',!!cap.thinking),capBadge('搜索',!!cap.search),capBadge('文件',!!cap.document),capBadge('图像',!!(cap.vision||cap.image_gen)),capBadge('音频',!!cap.audio)];
        return `<tr><td style="font-size:13px">${escape(m.id)}</td><td><div class="cap-line">${ch.join('')}</div></td></tr>`;
      }).join('');
    }
    async function up(){try{
      const[r,mr]=await Promise.all([API.getChannels(),API.getModels()]);
      channels=r.channels||[]; models=mr.models||[];
      document.getElementById('statHealthy').textContent=channels.filter(c=>c.status==='healthy').length;
      document.getElementById('statDegraded').textContent=channels.filter(c=>c.status==='degraded').length;
      document.getElementById('statUnconfigured').textContent=channels.filter(c=>c.status!=='healthy'&&c.status!=='degraded').length;
      document.getElementById('statModels').textContent=models.length;
      render();
    }catch(e){console.error(e)}}
    document.getElementById('channelFilter').addEventListener('change',render);
    document.getElementById('modelSearch').addEventListener('input',render);
    const p=new PollingManager(5000);p.start(up);window.addEventListener('beforeunload',()=>p.stop());
  </script>
</body>
</html>
