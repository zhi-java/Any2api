<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>性能</title>
  <link rel="stylesheet" href="/admin/styles/design-system.css">
  <link rel="stylesheet" href="/admin/styles/components.css">
  <script src="/admin/vendor/chart.umd.min.js"></script>
  <style>
    .metric-row { display: flex; gap: var(--space-3); flex-shrink: 0; }
    .metric-row .stat-card { flex: 1; }
    .chart-row { display: flex; gap: var(--space-3); flex: 1; min-height: 0; }
    .chart-row .card { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chart-box { flex: 1; min-height: 0; position: relative; }
    .chart-box canvas { max-height: 100%; }
    @media (max-width: 800px) { .chart-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header"><h1>性能</h1></div>
    <div class="page-body">
      <div class="metric-row">
        <div class="stat-card"><div class="stat-label">P50</div><div class="stat-value" id="mP50">-</div><div class="stat-change">ms</div></div>
        <div class="stat-card"><div class="stat-label">P90</div><div class="stat-value" id="mP90">-</div><div class="stat-change">ms</div></div>
        <div class="stat-card"><div class="stat-label">Token 速度</div><div class="stat-value" id="mSpeed">-</div><div class="stat-change">t/s</div></div>
        <div class="stat-card"><div class="stat-label">RPM</div><div class="stat-value" id="mRpm">-</div><div class="stat-change">请求/分</div></div>
      </div>
      <div class="chart-row">
        <div class="card"><div class="card-header"><div class="card-title">延迟</div></div><div class="chart-box"><canvas id="chLatency"></canvas></div></div>
        <div class="card"><div class="card-header"><div class="card-title">RPM</div></div><div class="chart-box"><canvas id="chRpm"></canvas></div></div>
        <div class="card"><div class="card-header"><div class="card-title">错误率</div></div><div class="chart-box"><canvas id="chError"></canvas></div></div>
      </div>
    </div>
  </div>
  <script type="module">
    import { initChartDefaults } from '/admin/scripts/charts.js'; initChartDefaults();
    const opts={responsive:!0,maintainAspectRatio:!1,plugins:{legend:{display:!1}},scales:{x:{grid:{display:!1},ticks:{font:{size:8},maxTicksLimit:5}},y:{beginAtZero:!0,grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:8}}}}};
    const mkC=(id,label)=>new Chart(document.getElementById(id),{type:'line',data:{labels:[],datasets:[{label,data:[],borderColor:'#0a84ff',fill:!1,tension:.2,pointRadius:0}]},options:opts});
    const cL=mkC('chLatency','ms'), cR=mkC('chRpm','RPM'), cE=mkC('chError','%');
    let pollId;
    function fmt(v){return v==null?'-':v<1?'<1ms':v<1000?v+'ms':(v/1000).toFixed(1)+'s'}
    async function up(){try{
      const s=await(await fetch('/admin/api/stats')).json(); const m=s.metrics||{};
      document.getElementById('mP50').textContent=fmt(m.ttfbP50);
      document.getElementById('mP90').textContent=fmt(m.ttfbP90);
      document.getElementById('mSpeed').textContent=m.tokenSpeed||0;
      document.getElementById('mRpm').textContent=m.rpm||0;
      const ts=await(await fetch('/performance/api/timeseries?range=6h')).json();
      const pts=ts.points||[]; if(!pts.length)return;
      const lb=pts.map(p=>{const d=new Date(p.t);return`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`});
      cL.data={labels:lb,datasets:[{label:'P50',data:pts.map(p=>p.ttfbP50),borderColor:'#30d158',fill:!1,tension:.2,pointRadius:0},{label:'P90',data:pts.map(p=>p.ttfbP90),borderColor:'#ff9f0a',fill:!1,tension:.2,pointRadius:0}]};
      cL.update();
      cR.data={labels:lb,datasets:[{label:'RPM',data:pts.map(p=>p.rpm),borderColor:'#0a84ff',fill:!1,tension:.2,pointRadius:0}]}; cR.update();
      cE.data={labels:lb,datasets:[{label:'错误率',data:pts.map(p=>p.errorRate),borderColor:'#ff453a',fill:!1,tension:.2,pointRadius:0}]}; cE.update();
    }catch(e){console.error(e)}}
    up();
    pollId=setInterval(up,10000);
    window.addEventListener('beforeunload',()=>clearInterval(pollId));
  </script>
</body>
</html>
